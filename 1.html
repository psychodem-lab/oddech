<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wybór Wzorca Oddechowego</title>
    <link rel="shortcut icon" type="image/png" href="cbt.png" />
    <style>
        /* Jasny motyw (domyślny) */
        :root {
            --primary-text: #3a4d39;
            --bg-color: #ffffff;
            --btn-inactive: #f2f3ef;
            --btn-active: #e7ece5;
            --btn-border: #a4b3a4;
            --btn-primary: #596d5a;
            --circle-bg: #f4f5f1;
            --text-secondary: #798a79;
            --shadow-rgb: 89, 109, 90;
            --header-border: #eaeaea;
            --h1-color: #2c392c;
            --btn-text: #607060;
            --phase-color: #526352;
            --instruction-color: #4a5a4a;
            --btn-primary-hover: #495a49;
            --btn-reset-hover: #e2e4de;
        }

        /* Ciemny motyw */
        [data-theme="dark"] {
            --primary-text: #e8ece8;
            --bg-color: #121412;
            --btn-inactive: #1e241e;
            --btn-active: #2a332a;
            --btn-border: #4a5a4a;
            --btn-primary: #4a5a4a;
            --circle-bg: #1a201a;
            --text-secondary: #8b998b;
            --shadow-rgb: 134, 163, 136;
            --header-border: #2a332a;
            --h1-color: #f0f4f0;
            --btn-text: #a0b0a0;
            --phase-color: #c0ccc0;
            --instruction-color: #d0dcd0;
            --btn-primary-hover: #5a6d5a;
            --btn-reset-hover: #2a332a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 30px 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 650px;
            width: 100%;
        }

        header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-bottom: 1px solid var(--header-border);
            padding-bottom: 20px;
            margin-bottom: 50px;
            transition: border-color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-text h1 {
            font-size: 1.5rem;
            margin: 0 0 8px 0;
            color: var(--h1-color);
            font-weight: 700;
            transition: color 0.3s;
        }

        .header-text p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0;
            transition: color 0.3s;
        }

        .btn-theme {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s, background-color 0.2s;
        }

        .btn-theme:hover {
            color: var(--primary-text);
            background-color: var(--btn-inactive);
        }

        .pattern-selector {
            display: flex;
            gap: 15px;
        }

        .pattern-btn {
            background-color: var(--btn-inactive);
            border: 1px solid transparent;
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--btn-text);
            transition: all 0.2s ease-in-out;
            line-height: 1.4;
            text-align: center;
        }

        .pattern-btn.active {
            background-color: var(--btn-active);
            border: 1px solid var(--btn-border);
            color: var(--primary-text);
        }

        .breathing-area {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 380px;
            margin-bottom: 30px;
        }

        .circle-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: var(--circle-bg);
            box-shadow: 0 0 80px 20px rgba(var(--shadow-rgb), 0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 1s ease-in-out, box-shadow 1s ease-in-out, background-color 0.3s;
        }

        .phase-text {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--phase-color);
            margin-bottom: -15px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .timer-text {
            font-size: 7rem;
            font-weight: 800;
            color: var(--primary-text);
            line-height: 1.2;
            margin: 0;
            transition: color 0.3s;
        }

        .unit-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: -10px;
            transition: color 0.3s;
        }

        .instructions {
            text-align: center;
            margin-bottom: 35px;
        }

        #instruction-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--instruction-color);
            margin-bottom: 8px;
            transition: color 0.3s;
        }

        .cycles {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin: 0;
            transition: color 0.3s;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .btn-start {
            background-color: var(--btn-primary);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-start:hover {
            background-color: var(--btn-primary-hover);
        }
        
        .btn-start:active {
            transform: scale(0.98);
        }

        .btn-reset {
            background-color: var(--btn-inactive);
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--primary-text);
            transition: background-color 0.2s, color 0.3s;
        }

        .btn-reset:hover {
            background-color: var(--btn-reset-hover);
        }

        svg {
            fill: currentColor;
        }

        @media (max-width: 600px) {
            .circle-container {
                width: 260px;
                height: 260px;
            }
            .timer-text { font-size: 5rem; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-top">
                <div class="header-text">
                    <h1>Wybór Wzorca Oddechowego</h1>
                    <p>Dostosuj rytm do swoich aktualnych potrzeb</p>
                </div>
                <button class="btn-theme" id="theme-btn" onclick="toggleTheme()" aria-label="Zmień motyw">
                    <svg id="theme-icon" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <!-- Ikona jest podmieniana przez JS -->
                        <path id="theme-path" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="pattern-selector">
                <button class="pattern-btn active" id="btn-box" onclick="setPattern('box')">Oddech Pudełkowy<br>(4-4-4-4)</button>
                <button class="pattern-btn" id="btn-478" onclick="setPattern('p478')">Oddech 4-7-8<br>(Głęboki Relaks)</button>
            </div>
        </header>

        <div class="breathing-area">
            <div class="circle-container" id="circle">
                <div class="phase-text" id="phase-text">WDECH</div>
                <div class="timer-text" id="timer-text">1</div>
                <div class="unit-text">sekund</div>
            </div>
        </div>

        <div class="instructions">
            <p id="instruction-text">Bierz powolny, głęboki wdech przez nos...</p>
            <p class="cycles">Wykonano pełnych cykli: <strong id="cycle-count" style="color:var(--primary-text);">0</strong></p>
        </div>

        <div class="controls">
            <button class="btn-start" id="start-btn" onclick="toggleTimer()">
                <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 5.14v14l11-7-11-7z"/>
                </svg>
                <svg id="pause-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
                <span id="start-btn-text">Rozpocznij Oddech</span>
            </button>
            <button class="btn-reset" onclick="resetTimer()" aria-label="Reset">
                <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Logika motywu
        const themePath = document.getElementById('theme-path');
        const moonPath = "M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z";
        const sunPath = "M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z";

        function setTheme(isDark) {
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                themePath.setAttribute('d', sunPath);
                localStorage.setItem('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                themePath.setAttribute('d', moonPath);
                localStorage.setItem('theme', 'light');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            setTheme(!isDark);
        }

        // Inicjalizacja motywu
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            setTheme(true);
        } else {
            setTheme(false);
        }

        // Logika aplikacji oddechowej
        const patterns = {
            box: [
                { phase: 'WDECH', time: 4, instruction: 'Bierz powolny, głęboki wdech przez nos...', scale: 1.25, shadow: 0.35 },
                { phase: 'ZATRZYMANIE', time: 4, instruction: 'Zatrzymaj powietrze w płucach...', scale: 1.25, shadow: 0.35 },
                { phase: 'WYDECH', time: 4, instruction: 'Wypuść powietrze powoli przez usta...', scale: 1.0, shadow: 0.2 },
                { phase: 'ZATRZYMANIE', time: 4, instruction: 'Poczekaj na kolejny wdech...', scale: 1.0, shadow: 0.2 }
            ],
            p478: [
                { phase: 'WDECH', time: 4, instruction: 'Bierz powolny, głęboki wdech przez nos...', scale: 1.25, shadow: 0.35 },
                { phase: 'ZATRZYMANIE', time: 7, instruction: 'Zatrzymaj powietrze w płucach...', scale: 1.25, shadow: 0.35 },
                { phase: 'WYDECH', time: 8, instruction: 'Wypuść powietrze powoli przez usta...', scale: 1.0, shadow: 0.2 }
            ]
        };

        let currentPatternId = 'box';
        let currentPhaseIndex = 0;
        let timeElapsed = 1;
        let isRunning = false;
        let timerInterval = null;
        let cycles = 0;

        const el = {
            circle: document.getElementById('circle'),
            phaseText: document.getElementById('phase-text'),
            timerText: document.getElementById('timer-text'),
            instructionText: document.getElementById('instruction-text'),
            cycleCount: document.getElementById('cycle-count'),
            startBtnText: document.getElementById('start-btn-text'),
            playIcon: document.getElementById('play-icon'),
            pauseIcon: document.getElementById('pause-icon'),
            btnBox: document.getElementById('btn-box'),
            btn478: document.getElementById('btn-478')
        };

        function updateUI(initAnimation = false) {
            const phase = patterns[currentPatternId][currentPhaseIndex];
            el.phaseText.textContent = phase.phase;
            el.timerText.textContent = timeElapsed;
            el.instructionText.textContent = phase.instruction;
            el.cycleCount.textContent = cycles;
            
            if (initAnimation) {
                if(phase.phase === 'WDECH' || phase.phase === 'WYDECH') {
                    el.circle.style.transition = `transform ${phase.time}s linear, box-shadow ${phase.time}s linear`;
                } else {
                    el.circle.style.transition = 'none';
                }
                el.circle.style.transform = `scale(${phase.scale})`;
                // Zmieniono na CSS Variable, aby reagowało na zmianę motywu na żywo
                el.circle.style.boxShadow = `0 0 80px 20px rgba(var(--shadow-rgb), ${phase.shadow})`;
            }
        }

        function setPattern(patternId) {
            if(isRunning) toggleTimer();
            currentPatternId = patternId;
            
            el.btnBox.classList.remove('active');
            el.btn478.classList.remove('active');
            if(patternId === 'box') el.btnBox.classList.add('active');
            if(patternId === 'p478') el.btn478.classList.add('active');

            resetTimer();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerInterval);
                el.startBtnText.textContent = 'Rozpocznij Oddech';
                el.playIcon.style.display = 'block';
                el.pauseIcon.style.display = 'none';
                
                const style = window.getComputedStyle(el.circle);
                const transform = style.transform;
                el.circle.style.transition = 'none';
                el.circle.style.transform = transform;
            } else {
                el.startBtnText.textContent = 'Zatrzymaj Oddech';
                el.playIcon.style.display = 'none';
                el.pauseIcon.style.display = 'block';
                
                updateUI(true);

                timerInterval = setInterval(() => {
                    timeElapsed++; 
                    
                    const currentPhaseTargetTime = patterns[currentPatternId][currentPhaseIndex].time;
                    
                    if (timeElapsed > currentPhaseTargetTime) {
                        currentPhaseIndex++;
                        
                        if (currentPhaseIndex >= patterns[currentPatternId].length) {
                            currentPhaseIndex = 0;
                            cycles++;
                        }
                        
                        timeElapsed = 1; 
                        
                        const nextPhase = patterns[currentPatternId][currentPhaseIndex];
                        if (nextPhase.phase === 'WDECH') {
                            el.circle.style.transition = 'none';
                            el.circle.style.transform = 'scale(1.0)';
                            el.circle.style.boxShadow = `0 0 80px 20px rgba(var(--shadow-rgb), 0.2)`;
                            void el.circle.offsetWidth; 
                        }
                        updateUI(true);
                    } else {
                        updateUI(false);
                    }
                }, 1000);
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            if (isRunning) toggleTimer();
            currentPhaseIndex = 0;
            timeElapsed = 1;
            cycles = 0;
            
            el.circle.style.transition = 'transform 0.5s ease, box-shadow 0.5s ease';
            el.circle.style.transform = 'scale(1.0)';
            el.circle.style.boxShadow = `0 0 80px 20px rgba(var(--shadow-rgb), 0.2)`;
            
            updateUI(false);
        }

        resetTimer();
    </script>
</body>
</html>
